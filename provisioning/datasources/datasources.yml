apiVersion: 1

datasources:
  - name: 'AWS Cost Explorer'
    uid: 'aws-cost-explorer'
    type: 'ivlabsdev-awscostexplorer-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      authMode: 'static'
      region: 'us-east-1'
      cacheTTLSeconds: 900
      cacheMaxEntries: 256
    secureJsonData:
      accessKeyId: '$AWS_ACCESS_KEY_ID'
      secretAccessKey: '$AWS_SECRET_ACCESS_KEY'
      sessionToken: '$AWS_SESSION_TOKEN'
